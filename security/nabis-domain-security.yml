- domain: nabis.pro
  detail: >-
    The API is served from nabis.pro, a second registrable domain with no SPF, no DMARC, no CAA and
    no DNSSEC — weaker than nabis.com, which at least has SPF and DMARC (p=none). Developers are
    told to call platform-api.nabis.pro by docs served from developers.nabis.com, so the two-domain
    split is also a phishing surface: a consumer has no published way to tell a real nabis.pro
    hostname from a lookalike.
