false_positives:
  - host: api.getnabis.com
    detail: >-
      Every path returns HTTP 200 with the identical 25-byte text/html body "Welcome to the Nabis
      API." This is a catch-all handler on the retired v1 API host, not a document. Treated as a
      miss on every path.
  - host: app.nabis.com
    detail: >-
      Every path returns HTTP 200 with the same 3,970-byte React SPA shell (title description
      "Click Button. Ship Weed."). Classic single-page-app catch-all. Treated as a miss on every
      path except /robots.txt, which returns a real 57-byte robots file.
notable_absence:
