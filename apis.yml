aid: nabis
name: Nabis
description: >-
  Nabis is a licensed cannabis wholesale distributor and B2B marketplace founded in 2018 by Vince C.
  Ning and Jun S. Lee, operating in California, New York and Nevada. It runs distribution and
  fulfillment warehouses, an ordering marketplace connecting 400+ cannabis brands to licensed
  retailers, an analytics layer, and Nabis Capital, an invoice-based financing product, plus Nabis
  BillPay and Nabis Tracker for retailers. The company reports that 99% of retailers in the three
  states it serves receive product through Nabis and that it fulfills 3,500+ wholesale orders a week.
  For developers it publishes the Nabis Platform API — a read-only, API-key-authenticated JSON REST
  API for brands and retailers covering inventory, inventory history, orders, invoices, retailers,
  warehouses and the Nabis delivery calendar, with separate California and New York route trees, and
  an implementation of the Universal Cannabis API labeling standard for order manifests and QR-code
  regulator events.
