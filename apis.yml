apis:
- name: Nabis Platform API v2
  description: >-
    The current Nabis Platform API. A read-only JSON REST API authenticated with a static
    x-nabis-access-token header, covering inventory and inventory history, orders, invoices,
    retailers, warehouses and the Nabis days-off delivery calendar, with a parallel /v2/ny/ route
    tree for New York, plus the /ucapi/ Universal Cannabis API labeling routes for order manifests
    and QR-code regulator events. 23 published operations, every one a GET. Rate limited to 15
    requests per minute per key.
  humanURL: https://developers.nabis.com/v2/docs/overview/introduction
  baseURL: https://platform-api.nabis.pro
