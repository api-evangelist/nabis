- name: Nabis Platform API v1 (deprecated)
  description: >-
    The original Nabis Platform API, published as a Redoc reference at developers.nabis.com and
    titled "Nabis Platform Api [DEPRECATED]" in its own specification. Four read-only operations —
    orders, detailed orders, inventory and invoices — authenticated with the same
    x-nabis-access-token header. The host now answers a plain-text catch-all on every path.
  humanURL: https://developers.nabis.com/
  baseURL: https://api.getnabis.com/platform/v1
  tags:
  - Inventory
  - Orders
  - Invoicing
  - Deprecated
  properties:
  - type: OpenAPI
    url: openapi/nabis-platform-api-v1-openapi.json
  - type: Documentation
    url: https://developers.nabis.com/
- name: Nabis Universal QR Code API (design specification)
  description: >-
    A first-party OpenAPI 3.0.0 domain model Nabis publishes in its public GitLab group for the
    Universal QR Code / Universal Cannabis API problem space — collections, sku batches and skus —
    with contact engineering@nabis.com. Marked "Sample API" in its own info.description and
    declaring no servers block, so it is a design artifact rather than a deployed endpoint; the
    deployed implementation of the standard is the /ucapi/ route group on the Platform API v2.
  humanURL: https://gitlab.com/nabis-engineering/core/universal-qr-codes
  tags:
  - Cannabis
  - Labeling
  - Standards
  properties:
  - type: OpenAPI
    url: openapi/nabis-universal-qr-code-openapi.yaml
  - type: SourceCode
    url: https://gitlab.com/nabis-engineering/core/universal-qr-codes
