                    example: '2022-04-20'
                    nullable: true
                    description: Most recent date upon which sku batch details were adjusted
                  batchManufacturingDate:
                    type: string
                    format: date
                    example: '2022-04-20'
                    description: Date upon which batch was manufactured
                  batchLicenseNumber:
                    type: string
                    description: Batch License Number
                  skuInventoryType:
                    type: string
                    description: If the SKU is cannabis or non-cannabis
                  skuInventoryClass:
                    type: string
                    description: General classification of an SKU's characteristics (i.e., edible)
                  skuInventoryCategory:
                    type: string
                    description: Specific categorization of an SKU's characteristics (i.e., gummy, chocolate,
                      etc.)
                  batchCbdPercentage:
                    type: number
                    format: number
                    nullable: true
                    description: '% CBD value of batch'
                  batchThcPercentage:
                    type: number
                    format: number
                    nullable: true
                    description: '% THC value of batch'
                  batchTags:
                    description: Internal-facing batch tags, visible to brands and admins (not visible
                      on marketplace)
                    nullable: false
                    type: array
                    items:
                      type: string
                  skuTags:
                    description: Custom Classification Associated with an Item
                    nullable: false
                    type: array
                    items:
                      type: string
                  batchOtherCannabinoidPercentage:
                    type: number
                    format: number
                    nullable: true
                    description: '% Other Cannabinoid value of batch'
                  batchThcAPercentage:
                    type: number
                    format: number
                    nullable: true
                    description: '% THC-A value of batch'
                  batchThcWeight:
                    type: number
                    format: number
                    nullable: true
                    description: THC weight value (mg) of batch
                  batchCbdWeight:
                    type: number
                    format: number
                    nullable: true
                    description: CBD weight value (mg) of batch
                  batchOtherCannabinoidWeight:
                    type: number
                    format: number
                    nullable: true
                    description: Other Cannabinoid weight value (mg) of batch
                  batchThcAWeight:
                    type: number
                    format: number
                    nullable: true
                    description: THC-A weight value (mg) of batch
                  batchAromas:
                    description: Aroma characteristics of batch
                    nullable: false
                    type: array
                    items:
                      type: string
                  skuBatchDaysAtNabis:
                    type: number
                    format: number
                    nullable: true
                    description: The number of days a sku batch has been stored at Nabis since the intake
                      date
                  skuIsSample:
                    type: string
                    description: If the inventory item is set as a Sample by default
                    nullable: false
                  skuStrainType:
                    type: string
                    description: Strain characteristics of inventory item
                  warehouseCounts:
                    description: Warehouse Counts. Note that these inventory counts are not real-time
                      and could have a delay in them between our core platform and this API. For more
