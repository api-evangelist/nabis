  /v2/invoice:
    get:
      operationId: InvoiceController_getInvoices
      description: Get Many Invoices (CA)
      tags:
      - Invoice
      parameters:
      - name: orderNumber
        required: false
        in: query
        example: 12345
        description: System-generated numeric ID for order
        schema:
          format: number
          nullable: true
          type: string
      - name: irn
        required: false
        in: query
        example: '12345'
        description: Order IRN (PO/SO)
        schema:
          nullable: true
          type: string
      - name: dispensary
        required: false
        in: query
        example: Dispensary name
        description: Dispensary name
        schema:
          nullable: true
          type: string
      - name: organizationName
        required: false
        in: query
        example: Organization name
        description: Organization name
        schema:
          nullable: true
          type: string
      - name: organizationId
        required: false
        in: query
        example: 458c8396-2b53-46cc-8a4d-b8f600eb3f1e
        description: Organization ID
        schema:
          nullable: true
          type: string
      - name: startDate
        required: false
        in: query
        example: '2022-04-20'
        description: Starting delivery date of order - "deliveryDate"
        schema:
          format: date
          type: string
      - name: endDate
        required: false
        in: query
        example: '2022-04-20'
        description: Ending delivery date of the order - "deliveryDate"
        schema:
          format: date
          type: string
      - name: startDueDate
        required: false
        in: query
        example: '2022-04-20'
        description: Starting date upon which order is due - "dueDate"
        schema:
          format: date
          type: string
      - name: endDueDate
        required: false
        in: query
        example: '2022-04-20'
        description: Ending date upon which order is due - "dueDate"
        schema:
          format: date
          type: string
      - name: page
        required: true
        in: query
        schema:
          default: 0
          type: number
      - name: limit
        required: true
        in: query
        schema:
          minimum: 1
          maximum: 500
          type: number
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: System-generated UUID to identify order
                  deliveryDate:
                    type: string
                    format: date
                    example: '2022-04-20'
                    description: Date upon which order is delivered
                    nullable: false
                  overdue:
                    type: number
                    description: Number of Days between current date and Due Date
                    nullable: false
                  discount:
                    type: number
                    description: Discount
                    format: number
                    nullable: false
                  name:
                    type: string
                    description: Brand-input name describing order
                    nullable: false
                  orderNumber:
                    type: number
                    description: System-generated numeric ID for order
                    nullable: false
                  surcharge:
                    type: number
                    description: Surcharge
                    format: number
                    nullable: false
                  creditMemo:
                    type: string
                    description: $ Amount of order-level credit reducing overall order $ amount (not related
                      to specific order/transaction; reflects pre-existing agreement)
                    nullable: true
                  creditMemoType:
                    type: string
                    nullable: true
                    description: The credit memo type for this order
                  creditMemoNote:
                    type: string
                    nullable: true
                    description: The credit memo note
                  creditMemoCreatedBy:
                    type: string
                    nullable: true
                    description: Email address of user that created the credit memo
                    format: email
                  creditMemoCreatedAt:
                    type: string
                    format: date-time
                    example: '2022-04-20T21:20:00.000Z'
                    nullable: true
                    description: The timestamp the credit memo was created
                  exciseTaxCollected:
                    type: number
                    format: number
                    description: Excise Tax Collected
                    nullable: false
                  organizationName:
                    type: string
                    description: Organization Name
                    nullable: false
                  dueDate:
                    type: string
                    format: date
                    example: '2022-04-20'
                    description: Invoice Due Date. Formerly named `gmvDueDate`
                    nullable: false
                  exciseTaxDueDate:
                    type: string
                    format: date
                    example: '2022-04-20'
                    description: Excise Tax Due Date
                    nullable: false
                  subtotal:
                    type: number
                    format: number
                    description: Subtotal. Formerly known as `gmv`.
                    nullable: false
                  subtotalCollected:
                    type: number
                    format: number
                    description: $ amount collected for order (typically from partial payments). Formerly
                      known as `gmvCollected`.
                    nullable: false
                  subtotalDue:
                    type: number
                    format: number
                    description: Net Amount less partial collections
                    nullable: false
                  total:
                    type: number
                    format: number
                    description: Order total
                    nullable: false
                  due:
                    type: number
                    format: number
                    description: Net balance and excise tax less any amount collected
                    nullable: false
                  manifest:
                    type: string
                    description: URL for order PDF documentation
                    nullable: false
                  posoNumber:
                    type: string
                    description: Brand-input value reflecting internal brand system ID to identify corresponding
                      Nabis order
                    nullable: true
                  futureNumber:
                    type: number
                    description: Order Number of future brand delivery to customer
                    nullable: false
                  futureDate:
                    type: string
                    format: date
                    example: '2022-04-20'
                    description: Date of future brand delivery to customer
                    nullable: false
                  tax:
                    type: number
                    format: number
                    description: Tax
                    nullable: false
                  dispensary:
                    type: string
                    description: Dispensary
                    nullable: false
                  siteState:
                    type: string
                    description: Site State
                    nullable: false
                  region:
                    type: string
                    description: Region
                    nullable: false
                  creator:
                    type: string
                    description: Name of the user that submitted order
                    nullable: false
                  creatorEmail:
                    type: string
                    description: Email address of user that submitted order
                    format: email
                    nullable: false
                  retailerUuid:
                    type: string
                    description: System-generated unique ID of order destination
                    format: uuid
                    nullable: false
                  mustPayPriorBalance:
                    type: boolean
                    description: Must pay prior balance (Balances required for delivery will be associated
                      with orders created after 2023-03-29)
                    nullable: false
                  lineItems:
                    description: Line Items
                    nullable: false
                    type: array
                    items:
                      type: object
                      properties:
                        quantity:
                          type: number
                          format: number
                          description: Line item quantity ordered
                          nullable: false
                        pricePerUnit:
                          type: number
                          format: number
                          description: Line item $ price per unit
                          nullable: true
                        standardPricePerUnit:
                          type: number
                          format: number
                          description: The wholesale, un-discounted system unit price of a product from
                            the Inventory Tab at time of order creation
                          nullable: true
                        isExciseTaxable:
                          type: boolean
                          description: Line item is excise taxable
                          nullable: false
                        discount:
                          type: number
                          format: number
                          description: Line item discount amount
                          nullable: false
                      required:
                      - quantity
                      - pricePerUnit
                      - standardPricePerUnit
                      - isExciseTaxable
                      - discount
                required:
                - id
                - deliveryDate
                - overdue
                - discount
                - name
                - orderNumber
                - surcharge
                - creditMemo
                - creditMemoType
                - creditMemoNote
                - creditMemoCreatedBy
                - creditMemoCreatedAt
                - exciseTaxCollected
                - organizationName
                - dueDate
                - exciseTaxDueDate
                - subtotal
                - subtotalCollected
                - subtotalDue
                - total
                - due
                - manifest
