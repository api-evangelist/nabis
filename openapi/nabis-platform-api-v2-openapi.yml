  /v2/order:
    get:
      operationId: OrderController_getOrders
      description: Individual query parameters only accept singular values
      tags:
      - Order
      parameters:
      - name: startCreatedAt
        required: false
        in: query
        example: '2022-04-20'
        description: Creation start date in the filter
        schema:
          format: date
          type: string
      - name: endCreatedAt
        required: false
        in: query
        example: '2022-04-20'
        description: Creation end date in the filter
        schema:
          format: date
          type: string
      - name: startDeliveryDate
        required: false
        in: query
        example: '2022-04-20'
        description: Delivery start date in the filter
        schema:
          format: date
          type: string
      - name: endDeliveryDate
        required: false
        in: query
        example: '2022-04-20'
        description: Delivery end date in the filter
        schema:
          format: date
          type: string
      - name: startLastNonPaymentDate
        required: false
        in: query
        example: '2022-04-20'
        description: Orders which have a last non payment date greater than or equal to this date
        schema:
          format: date
          type: string
      - name: endLastNonPaymentDate
        required: false
        in: query
        example: '2022-04-20'
        description: Orders which have a last non payment date less than or equal to this date
        schema:
          format: date
          type: string
      - name: paymentStatus
        required: false
        in: query
        description: Payment Status. This only accepts a _single value_.
        schema:
          enum:
          - COD_PAID
          - NET_TERMS_PAID
          - PROCESSING
          - REMITTED
          - SELF_COLLECTED
          - UNPAID
          - PAYMENT_SENT
          - WRITE_OFF
          - THIRD_PARTY_COLLECTIONS
          - PARTIAL_PAID
          - DRIVER_PROCESSING
          type: string
      - name: paymentTerms
        required: false
        in: query
        description: Payment Terms; 0 implies COD. This only accepts a _single value_.
        schema:
          enum:
          - '0'
          - '7'
          - '14'
          - '15'
          - '30'
          - '45'
          - '60'
          - '90'
          type: string
      - name: action
        required: false
        in: query
        description: Order Action. This only accepts a _single value_.
        schema:
          enum:
          - DELIVERY_TO_BRAND
          - DELIVERY_TO_RETAILER
          - DROPOFF_TO_NABIS
          - INTERNAL_TRANSFER
          - PICKUP_FROM_BRAND
          - PICKUP_FROM_NABIS
          type: string
      - name: status
        required: false
        in: query
        description: Order Status. This only accepts a _single value_.
        schema:
          enum:
          - ATTEMPTED
          - CANCELLED
          - DELAYED
          - DELIVERED
          - DELIVERED_WITH_EDITS
          - IN_TRANSIT
          - REJECTED
          - SCHEDULED
          - TRANSFERRING
          - UNSCHEDULED
          type: string
      - name: referrer
        required: false
        in: query
        description: Order Referrer. This only accepts a _single value_.
        schema:
          enum:
          - BRAND
          - RETAILER
          type: string
      - name: warehouse
        required: false
        in: query
        description: Order Warehouse.
        schema:
          format: uuid
          type: string
      - name: startUpdatedAt
        required: false
        in: query
        example: '2022-04-20'
        description: Updated start date in the filter
        schema:
          format: date
          type: string
      - name: endUpdatedAt
        required: false
        in: query
        example: '2022-04-20'
        description: Updated end date in the filter
        schema:
          format: date
          type: string
      - name: lastNonPaymentReason
        required: false
        in: query
        description: Filter by orders with a lastNonPaymentReason
        schema:
          type: boolean
      - name: page
        required: true
        in: query
        schema:
          default: 0
          type: number
      - name: limit
        required: true
        in: query
        schema:
          minimum: 1
          maximum: 500
          type: number
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: System-generated UUID to identify order
                  deliveryDate:
                    type: string
                    format: date
                    example: '2022-04-20'
                    nullable: true
                    description: Date upon which order is delivered
                  createdDate:
                    type: string
                    format: date
                    example: '2022-04-20'
                    nullable: true
                    description: Date upon which order is submitted/created
                  createdTimestamp:
                    type: string
                    format: date-time
                    example: '2022-04-20T21:20:00.000Z'
                    description: Timestamp upon which order is submitted/created
                  updatedDate:
                    type: string
                    format: date
                    example: '2022-04-20'
                    nullable: true
                    description: Date upon which order is updated
                  updatedTimestamp:
                    type: string
                    format: date-time
                    example: '2022-04-20T21:20:00.000Z'
                    description: Timestamp upon which order is updated
                  order:
                    type: number
                    format: number
                    nullable: true
                    description: System-generated numeric ID for order
                    example: '12345'
                  lineItemId:
                    type: string
                    format: uuid
                    description: Unique ID of each line-item on order
                  orderName:
                    type: string
                    nullable: true
                    description: Brand-input name describing order
                  organization:
                    type: string
                    description: Name of Brand organization
                  orderAction:
                    type: string
                    enum:
                    - DELIVERY_TO_BRAND
                    - DELIVERY_TO_RETAILER
                    - DROPOFF_TO_NABIS
                    - INTERNAL_TRANSFER
                    - PICKUP_FROM_BRAND
                    - PICKUP_FROM_NABIS
                    description: Label of order that describes the type of movement that is occurring
                  status:
                    type: string
                    enum:
                    - ATTEMPTED
                    - CANCELLED
                    - DELAYED
                    - DELIVERED
                    - DELIVERED_WITH_EDITS
                    - IN_TRANSIT
                    - REJECTED
                    - SCHEDULED
                    - TRANSFERRING
                    - UNSCHEDULED
                    description: Description of the delivery status of an order; "completed" orders have
                      status of 'Delivered' or 'Delivered With Edits'
                    nullable: true
                  creator:
                    type: string
                    format: email
                    nullable: true
                    description: Email address of user that submitted order
                  retailer:
                    type: string
                    nullable: true
                    description: Name of order destination
                  retailerParentOrganization:
                    type: string
                    nullable: true
                    description: Name of retailer parent organization
                  siteAddress:
                    type: string
                    description: Address of order destination
                  manufacturerLicenseNumber:
                    type: string
                    description: License number of the manufacturing entity associated with the inventory
                      item
                  titleholderLicenseNumber:
                    type: string
                    nullable: true
                    description: License number of the title-holding entity associated with the inventory
                      item
                  siteLicenseNumber:
                    type: string
                    description: License number of order destination
                  sourceWarehouse:
                    type: string
                    format: uuid
                    description: Nabis warehouse of origination
                  orderSubtotal:
                    type: number
                    format: number
                    description: $ Subtotal of the Gross Merchandise Value of order (equals sum of all
                      line-item subtotal). Formerly known as `orderGMV`.
                  subtotalCollected:
                    type: number
                    format: number
                    description: $ amount collected for order (typically from partial payments).
                    nullable: false
                  orderDiscount:
                    type: number
                    format: number
                    description: $ Amount of order-level discount reducing overall order $ amount (related
                      to the specific order/transaction)
                  creditMemo:
                    type: number
                    format: number
                    nullable: true
                    description: $ Amount of order-level credit reducing overall order $ amount (not related
                      to specific order/transaction; reflects pre-existing agreement. Credit memos are
                      always scoped to a specific order and cannot exist independently — they are created
                      and applied in the context of a single order. This value may change if the credit
                      memo is modified after initial application.')
                  creditMemoType:
                    type: string
                    nullable: true
                    description: The credit memo type for this order
                  creditMemoNote:
                    type: string
                    nullable: true
                    description: The credit memo note
                  creditMemoCreatedBy:
                    type: string
                    nullable: true
                    description: Email address of user that created the credit memo
                    format: email
                  creditMemoCreatedAt:
                    type: string
                    format: date-time
                    example: '2022-04-20T21:20:00.000Z'
                    nullable: true
                    description: The timestamp the credit memo was created
                  surcharge:
                    type: number
                    format: number
                    description: Surcharge
                  skuCode:
                    type: string
                    description: Brand-input code for inventory item, typically used for internal brand
                      system mapping
                  strain:
                    type: string
                    nullable: true
                    description: Strain
                  units:
                    type: number
                    format: number
                    nullable: true
                    description: Number of units per line-item on order
                  pricePerUnit:
                    type: number
                    format: number
                    nullable: true
                    description: Line-Item price per unit $ value on order
                  standardPricePerUnit:
                    type: number
                    format: number
                    nullable: true
                    description: The wholesale, un-discounted system unit price of a product from the
                      Inventory Tab at time of order creation
                  lineItemDiscount:
                    type: number
                    format: number
                    nullable: true
                    description: $ Amount of discount applied on a per line-item level
                  lineItemSubtotal:
                    type: number
                    format: number
                    nullable: true
                    description: Subtotal gross $ amount for a line item (equals Number of Units x Price
