      description: Please reach out to partnerships@nabis.com for information on API access.
      tags:
      - NY Order
      parameters:
      - name: action
        required: false
        in: query
        description: Order Action
        schema:
          enum:
          - DELIVERY_TO_BRAND
          - DELIVERY_TO_RETAILER
          - DROPOFF_TO_NABIS
          - INTERNAL_TRANSFER
          - PICKUP_FROM_BRAND
          - PICKUP_FROM_NABIS
          type: string
      - name: status
        required: false
        in: query
        description: Order Status
        schema:
          enum:
          - ATTEMPTED
          - CANCELLED
          - DELAYED
          - DELIVERED
          - DELIVERED_WITH_EDITS
          - IN_TRANSIT
          - REJECTED
          - SCHEDULED
          - TRANSFERRING
          - UNSCHEDULED
          type: string
      - name: referrer
        required: false
        in: query
        description: Order Referrer
        schema:
          enum:
          - BRAND
          - RETAILER
          type: string
      - name: warehouseId
        required: false
        in: query
        description: Order Warehouse
        schema:
          format: uuid
          type: string
      - name: page
        required: true
        in: query
        schema:
          default: 0
          type: number
      - name: limit
        required: true
        in: query
        schema:
          minimum: 1
          maximum: 500
          type: number
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: System-generated UUID to identify order
                  deliveryDate:
                    type: string
                    format: date
                    description: Date upon which order is delivered
                  createdDate:
                    type: string
                    format: date
                    description: Date upon which order is submitted/created
                  createdTimestamp:
                    type: string
                    format: date-time
                    description: Timestamp upon which order is submitted/created
                  updatedDate:
                    type: string
                    format: date
                    description: Date upon which order is updated
                  updatedTimestamp:
                    type: string
                    format: date-time
                    description: Timestamp upon which order is updated
                  order:
                    type: string
                    description: System-generated numeric ID for order
                    example: '12345'
                  lineItemId:
                    type: string
                    description: Unique ID of each line-item on order
                  orderAction:
                    type: string
                    description: Label of order that describes the type of movement that is occurring
                  status:
                    type: string
                    description: Description of the delivery status of an order; "completed" orders have
                      status of 'Delivered' or 'Delivered With Edits'
                  creator:
                    type: string
                    description: Email address of user that submitted order
                  retailer:
                    type: string
                    description: Name of order destination
                  siteAddress:
                    type: string
                    description: Address of order destination
                  siteLicenseNumber:
                    type: string
                    description: License number of order destination
                  sourceWarehouse:
                    type: string
                    format: uuid
                    description: Nabis warehouse of origination
                  orderSubtotal:
                    type: number
                    description: $ Subtotal of the Gross Merchandise Value of order (equals sum of all
                      line-item subtotal).
                  creditMemo:
                    type: number
                    nullable: true
