                  skuCBCA:
                    type: string
                    description: Field does not exist in NY system. Always returns empty array for CA compatibility.
                  skuTHCVA:
                    type: string
                    description: Field does not exist in NY system. Always returns empty array for CA compatibility.
                  skuCBDVA:
                    type: string
                    description: Field does not exist in NY system. Always returns empty array for CA compatibility.
                  skuDelta10THC:
                    type: string
                    description: Field does not exist in NY system. Always returns empty array for CA compatibility.
                  skuDelta9THC:
                    type: string
                    description: Field does not exist in NY system. Always returns empty array for CA compatibility.
                  skuThcPotencyMg:
                    type: string
                    description: Field does not exist in NY system. Always returns empty array for CA compatibility.
                  skuThcPotencyPercentage:
                    type: string
                    description: Field does not exist in NY system. Always returns empty array for CA compatibility.
                  skuCannabinoidTypeA:
                    type: string
                    description: Field does not exist in NY system. Always returns empty array for CA compatibility.
                  skuCannabinoidTypeB:
                    type: string
                    description: Field does not exist in NY system. Always returns empty array for CA compatibility.
                  warehouseCounts:
                    description: Warehouse Counts. Note that these inventory counts are not real-time and could have a delay in them between our core platform and this API. For more information, please visit the Inventory Quantities page for more detail.
                    type: array
                    items:
                      type: object
                      properties:
                        incoming:
                          type: number
                          format: number
                          description: Corresponding inventory counts based on warehouse location
                        outgoing:
                          type: number
                          format: number
                          description: Corresponding inventory counts based on warehouse location
                        available:
                          type: number
                          format: number
                          description: Corresponding inventory counts based on warehouse location
                        counted:
                          type: number
                          format: number
                          description: Corresponding inventory counts based on warehouse location
                        quarantined:
                          type: number
                          format: number
                          description: Corresponding inventory counts based on warehouse location
                        packed:
                          type: number
                          format: number
                          description: Corresponding inventory counts based on warehouse location
                        updatedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          example: '2022-04-20T21:20:00.000Z'
                          description: The last updated made when a difference was detected in between our cached inventory data and our warehouse inventory system.
                        warehouseId:
                          type: string
                          format: uuid
                          description: Nabis warehouse of origination
                      required:
                      - incoming
                      - outgoing
                      - available
                      - counted
                      - quarantined
                      - packed
                      - updatedAt
                      - warehouseId
                required:
                - skuCode
                - skuName
                - batchCode
                - skuUnit
                - skuPricePerUnit
                - batchExpirationDate
                - skuBatchLastUpdatedDate
