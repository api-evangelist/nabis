                  skuCBG:
                    type: string
                    description: Field does not exist in NY system. Always returns empty array for CA compatibility.
                  skuCBN:
                    type: string
                    description: Field does not exist in NY system. Always returns empty array for CA compatibility.
                  skuTHCV:
                    type: string
                    description: Field does not exist in NY system. Always returns empty array for CA compatibility.
                  skuCBC:
                    type: string
                    description: Field does not exist in NY system. Always returns empty array for CA compatibility.
                  skuDelta8THC:
                    type: string
                    description: Field does not exist in NY system. Always returns empty array for CA compatibility.
                  skuCBDV:
                    type: string
                    description: Field does not exist in NY system. Always returns empty array for CA compatibility.
                  skuTHCA:
                    type: string
